name: Data Sciences International
description: >-
  Data Sciences International (DSI) is a preclinical research instrumentation and
  services company for in vivo physiology and translational research, operating as
  part of Harvard Bioscience. DSI builds implantable and external telemetry systems,
  respiratory measurement (plethysmography, airway mechanics, pulmonary function),
  inhalation and smoke-exposure systems, iPRECIO infusion pumps, and behavioral
  monitoring (VivaMARS), paired with analysis software (Ponemah, FinePointe, NeuroScore)
  and surgical, data-analysis, GLP-validation and training services. It is a
  laboratory-instrument and life-sciences vendor rather than an API provider; no public
  developer API, SDK, or OpenAPI surface is published. Surfaced as a portfolio company
  of canaan-partners and profiled in the API Evangelist network.
